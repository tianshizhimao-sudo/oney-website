      title: "How to Check Your Financial Health (Before Talking to a Broker)",

      readTime: "6 min read",
      content: `
        <h2>You Saved the Deposit. The Bank Still Said No.</h2>
        <p>You did everything right. Cut back on takeaway. Skipped the holiday. Watched your savings inch past that magic number. Then you walked into the bank, confident — and they said no.</p>
        <p>Not because you didn't have enough saved. Because your financial picture didn't add up the way they needed it to.</p>
        <p>This happens more than you'd think. And it almost always comes down to the same thing: people focus on the deposit and forget everything else banks care about.</p>
        <p>Here's the good news — most of it is fixable. You just need to know where to look.</p>

        <h2>Think of It Like a Health Check-Up</h2>
        <p>You go to the doctor once a year (or you should). Not because something's wrong — because catching things early is easier than fixing them later.</p>
        <p>A financial health check works the same way. It's an honest look at where your money stands right now — your income, your debts, your spending, your safety net. No judgement. Just clarity.</p>
        <p>Whether you're planning to buy your first home, refinancing an existing loan, or just want to know where you stand — it starts with five things.</p>

        <h2>The 5 Things That Actually Matter</h2>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">1. Your Credit Score</h3>
        <p>Your credit score is your financial reputation. Every time you apply for a credit card, miss a bill payment, or default on a loan — it shows up here. Lenders use it to decide how risky you are.</p>
        <p><strong>What to do:</strong> Check your score for free through Equifax, Experian, or illion. Anything above 700 is solid. Below 500, and most lenders will hesitate. If you find errors — and plenty of people do — dispute them. A wrong default listing from three years ago could be the thing standing between you and an approval.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">2. Your Debt-to-Income Ratio</h3>
        <p>This is the one most people get wrong. You might earn $120k a year and think you're in great shape. But if you've got $30k in car finance, $15k on credit cards, and a $10k personal loan — banks see a very different picture.</p>
        <p>Your debt-to-income ratio (DTI) tells lenders how much of your income is already committed to repaying debt. Lower is better. Under 30% is where you want to be. Above 50%, and you're going to struggle.</p>
        <p><strong>What to do:</strong> Add up every monthly debt repayment. Divide it by your gross monthly income. If the number makes you uncomfortable, that's useful information. Pay down the smallest debts first — it frees up borrowing capacity faster than you'd expect.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">3. Your Savings and Buffer</h3>
        <p>The deposit gets all the attention, but lenders also want to see what's left over <em>after</em> you put that deposit down. They call it "genuine savings" — money you've accumulated over time, not a lump sum transferred last Tuesday.</p>
        <p>Most lenders want to see at least three months of living expenses as a buffer. It tells them you won't be one unexpected car repair away from missing a mortgage payment.</p>
        <p><strong>What to do:</strong> If your savings have been sitting flat, start building a buffer now. Even $200 a week into a separate account creates a track record. Three to six months of expenses is the sweet spot.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">4. Your Spending Patterns</h3>
        <p>Banks will look at your last three to six months of bank statements. Every transaction. That $45 UberEats three times a week? They see it. The $200 monthly subscription stack? They see that too.</p>
        <p>This isn't about being perfect. It's about showing that you can manage money consistently. Lenders want to see that your spending is stable and that you're living within your means.</p>
        <p><strong>What to do:</strong> Pull up your last 90 days of transactions. Categorise them honestly. Look for subscriptions you forgot about, spending spikes you can explain, and patterns that might raise questions. You don't need to live like a monk — you just need to show you're in control.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">5. Your Employment Stability</h3>
        <p>A six-figure salary means nothing if you started the job last month. Lenders love stability — ideally, you've been with the same employer for at least six months, or in the same industry for two-plus years.</p>
        <p>Self-employed? Different rules. Most lenders want two years of tax returns showing consistent income. Some will work with one year if the numbers are strong enough — but you need to know which lenders those are.</p>
        <p><strong>What to do:</strong> If you're thinking about changing jobs, do it <em>after</em> your loan settles, not before. If you're already self-employed, make sure your tax returns are up to date and your accountant isn't being too aggressive with deductions. Every dollar they write off reduces your borrowing power.</p>

        <h2>When Should You Talk to a Broker?</h2>
        <p>Here's the thing — you don't need to have all five of these sorted perfectly before you reach out. In fact, that's exactly what a good broker helps with.</p>
        <p>A checklist is a starting point. But a broker sees these numbers in context. They know which lenders care most about credit scores and which ones focus on savings history. They know when a 35% DTI is fine and when it's a dealbreaker.</p>
        <p>At Oney & Co, we've spent 8 years inside the banking system. We know what triggers a decline and what gets an approval across the line. That's not something you get from a checklist — it comes from knowing how lenders actually think.</p>
        <p>The best time to talk to a broker isn't when everything's perfect. It's when you want a clear picture of where you stand and what to do next.</p>

        <div class="article-cta">
          <h3>Get Your Free Financial Health Check</h3>
          <p>Stop guessing. Get a clear snapshot of your mortgage readiness — no obligation, no sales pitch. Five minutes now could save you six months of wasted applications.</p>
          <a href="https://fhc.oneyco.com.au" class="btn btn-primary">Take the Free Health Check →</a>
        </div>

        <p class="disclaimer">General information only. This article does not constitute personal financial advice. Individual circumstances vary — consider seeking advice from a licensed mortgage broker or financial adviser.</p>
      `
    },

    "rba-rate-cut-what-it-means": {
      title: "RBA Just Cut Rates — What It Actually Means For You",
      pillar: "rate-watch",
      pillarLabel: "Rate Watch",
      date: "28 February 2026",
      readTime: "5 min read",
      content: `
        <h2>The headline vs the reality</h2>
        <p>On 18 February 2025, the Reserve Bank of Australia cut the cash rate by 25 basis points to <strong>4.10%</strong> — the first cut since November 2020. Since then, markets have been pricing in further reductions through 2025 and into 2026.</p>
        <p>But here's what most headlines miss: <strong>the cash rate and your mortgage rate are not the same thing.</strong> Banks decide independently how much of any cut they pass on. Historically, the pass-through has varied significantly.</p>

        <h2>What the data shows</h2>
        <table class="data-table">
          <thead>
            <tr><th>Metric</th><th>Before Feb 2025 Cut</th><th>Current (Feb 2026)</th><th>Change</th></tr>
          </thead>
          <tbody>
            <tr><td>RBA Cash Rate</td><td>4.35%</td><td>3.85%*</td><td>↓ 0.50%</td></tr>
            <tr><td>Big 4 Avg Variable Rate</td><td>6.29%</td><td>5.89%*</td><td>↓ 0.40%</td></tr>
            <tr><td>Best Market Variable Rate</td><td>5.74%</td><td>5.34%*</td><td>↓ 0.40%</td></tr>
            <tr><td>Monthly Repayment ($600K)</td><td>$3,724</td><td>$3,549*</td><td>↓ $175/mo</td></tr>
          </tbody>
        </table>
        <p style="font-size:13px;color:var(--text-muted);">*Indicative figures based on market trends. Actual rates vary by lender and individual circumstances. Source: RBA, comparison market data.</p>

        <p>Notice the gap: the RBA cut by 0.50%, but the average variable rate only dropped about 0.40%. That 10 basis point difference is money banks kept. On a $600,000 loan, that's roughly <strong>$35 per month</strong> you're not getting back.</p>

        <h2>Why banks don't always pass on the full cut</h2>
        <p>Banks have funding costs beyond the cash rate — wholesale markets, term deposits, and regulatory capital requirements all play a role. When the RBA cuts, banks use it as an opportunity to rebuild margins compressed during the hiking cycle.</p>
        <p>This isn't unique to Australia. It's a global pattern. But it does mean you can't assume a rate cut equals an automatic saving.</p>

        <h2>Who benefits most (and least)</h2>
        <ul>
          <li><strong>Variable rate holders</strong> — benefit automatically, but not always in full</li>
          <li><strong>Fixed rate holders</strong> — no change until your fixed term expires</li>
          <li><strong>New borrowers</strong> — often get better rates than existing customers (the "loyalty penalty")</li>
          <li><strong>Interest-only borrowers</strong> — smaller dollar savings since payments are already lower</li>
        </ul>

        <h2>What you can actually do</h2>
        <p>A rate cut is a prompt, not a solution. Here are three practical steps:</p>
        <ol>
          <li><strong>Check your current rate</strong> against what's available. If you're more than 0.30% above market, there's room to negotiate or switch.</li>
          <li><strong>Call your lender</strong> and ask for a rate review. Banks have retention teams specifically for this. It takes 15 minutes.</li>
          <li><strong>Run the numbers</strong> — use a financial health check tool to see your actual position: LVR, equity, and what rate you could realistically get.</li>
        </ol>

        <div class="article-cta">
          <h3>See where you actually stand</h3>
          <p>Our free Financial Health Check shows your LVR, borrowing capacity, and whether your rate is competitive. Takes 2 minutes. No sign-up required.</p>
          <a href="https://fhc.oneyco.com.au" class="btn btn-primary">Start Free Health Check →</a>
        </div>

        <p class="disclaimer">General information only. This article does not constitute personal financial advice. All figures are indicative based on publicly available market data. Individual circumstances vary — consider seeking advice from a licensed professional. Data sources: Reserve Bank of Australia, major bank published rates, mortgage comparison aggregators.</p>
      `
    },

        <p>When rates were climbing, the answer felt obvious — lock in before it gets worse. But now that rates are falling, the question has flipped: <strong>should you fix at today's lower rate, or stay variable and ride the cuts down?</strong></p>
        <p>There's no universally right answer. But the data can help you think through it clearly.</p>

        <h2>The case for staying variable</h2>
        <ul>
          <li><strong>You benefit from every future cut</strong> — if the RBA cuts more aggressively than expected, you capture all the savings</li>
          <li><strong>Flexibility</strong> — no break costs, ability to refinance anytime, make extra repayments without restrictions</li>
          <li><strong>Offset accounts</strong> — most variable loans come with full offset, which can save thousands in interest</li>
        </ul>

        <h2>The case for fixing</h2>
        <ul>
          <li><strong>Certainty</strong> — you know exactly what your repayments will be for 1-3 years</li>
          <li><strong>Protection against surprises</strong> — if inflation reignites and rates go back up, you're shielded</li>
          <li><strong>Budget clarity</strong> — particularly valuable if your cash flow is tight</li>
