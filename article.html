      content: `
        <h2>You Saved the Deposit. The Bank Still Said No.</h2>
        <p>You did everything right. Cut back on takeaway. Skipped the holiday. Watched your savings inch past that magic number. Then you walked into the bank, confident — and they said no.</p>
        <p>Not because you didn't have enough saved. Because your financial picture didn't add up the way they needed it to.</p>
        <p>This happens more than you'd think. And it almost always comes down to the same thing: people focus on the deposit and forget everything else banks care about.</p>
        <p>Here's the good news — most of it is fixable. You just need to know where to look.</p>

        <h2>Think of It Like a Health Check-Up</h2>
        <p>You go to the doctor once a year (or you should). Not because something's wrong — because catching things early is easier than fixing them later.</p>
        <p>A financial health check works the same way. It's an honest look at where your money stands right now — your income, your debts, your spending, your safety net. No judgement. Just clarity.</p>
        <p>Whether you're planning to buy your first home, refinancing an existing loan, or just want to know where you stand — it starts with five things.</p>

        <h2>The 5 Things That Actually Matter</h2>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">1. Your Credit Score</h3>
        <p>Your credit score is your financial reputation. Every time you apply for a credit card, miss a bill payment, or default on a loan — it shows up here. Lenders use it to decide how risky you are.</p>
        <p><strong>What to do:</strong> Check your score for free through Equifax, Experian, or illion. Anything above 700 is solid. Below 500, and most lenders will hesitate. If you find errors — and plenty of people do — dispute them. A wrong default listing from three years ago could be the thing standing between you and an approval.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">2. Your Debt-to-Income Ratio</h3>
        <p>This is the one most people get wrong. You might earn $120k a year and think you're in great shape. But if you've got $30k in car finance, $15k on credit cards, and a $10k personal loan — banks see a very different picture.</p>
        <p>Your debt-to-income ratio (DTI) tells lenders how much of your income is already committed to repaying debt. Lower is better. Under 30% is where you want to be. Above 50%, and you're going to struggle.</p>
        <p><strong>What to do:</strong> Add up every monthly debt repayment. Divide it by your gross monthly income. If the number makes you uncomfortable, that's useful information. Pay down the smallest debts first — it frees up borrowing capacity faster than you'd expect.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">3. Your Savings and Buffer</h3>
        <p>The deposit gets all the attention, but lenders also want to see what's left over <em>after</em> you put that deposit down. They call it "genuine savings" — money you've accumulated over time, not a lump sum transferred last Tuesday.</p>
        <p>Most lenders want to see at least three months of living expenses as a buffer. It tells them you won't be one unexpected car repair away from missing a mortgage payment.</p>
        <p><strong>What to do:</strong> If your savings have been sitting flat, start building a buffer now. Even $200 a week into a separate account creates a track record. Three to six months of expenses is the sweet spot.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">4. Your Spending Patterns</h3>
        <p>Banks will look at your last three to six months of bank statements. Every transaction. That $45 UberEats three times a week? They see it. The $200 monthly subscription stack? They see that too.</p>
        <p>This isn't about being perfect. It's about showing that you can manage money consistently. Lenders want to see that your spending is stable and that you're living within your means.</p>
        <p><strong>What to do:</strong> Pull up your last 90 days of transactions. Categorise them honestly. Look for subscriptions you forgot about, spending spikes you can explain, and patterns that might raise questions. You don't need to live like a monk — you just need to show you're in control.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">5. Your Employment Stability</h3>
        <p>A six-figure salary means nothing if you started the job last month. Lenders love stability — ideally, you've been with the same employer for at least six months, or in the same industry for two-plus years.</p>
        <p>Self-employed? Different rules. Most lenders want two years of tax returns showing consistent income. Some will work with one year if the numbers are strong enough — but you need to know which lenders those are.</p>
        <p><strong>What to do:</strong> If you're thinking about changing jobs, do it <em>after</em> your loan settles, not before. If you're already self-employed, make sure your tax returns are up to date and your accountant isn't being too aggressive with deductions. Every dollar they write off reduces your borrowing power.</p>

        <h2>When Should You Talk to a Broker?</h2>
        <p>Here's the thing — you don't need to have all five of these sorted perfectly before you reach out. In fact, that's exactly what a good broker helps with.</p>
        <p>A checklist is a starting point. But a broker sees these numbers in context. They know which lenders care most about credit scores and which ones focus on savings history. They know when a 35% DTI is fine and when it's a dealbreaker.</p>
        <p>At Oney & Co, we've spent 8 years inside the banking system. We know what triggers a decline and what gets an approval across the line. That's not something you get from a checklist — it comes from knowing how lenders actually think.</p>
        <p>The best time to talk to a broker isn't when everything's perfect. It's when you want a clear picture of where you stand and what to do next.</p>

        <div class="article-cta">
          <h3>Get Your Free Financial Health Check</h3>
          <p>Stop guessing. Get a clear snapshot of your mortgage readiness — no obligation, no sales pitch. Five minutes now could save you six months of wasted applications.</p>
          <a href="https://fhc.oneyco.com.au" class="btn btn-primary">Take the Free Health Check →</a>
        </div>

        <p class="disclaimer">General information only. This article does not constitute personal financial advice. Individual circumstances vary — consider seeking advice from a licensed mortgage broker or financial adviser.</p>

    "what-is-your-bank-ready-score": {
      title: "What Is Your Bank-Ready Score?",
      pillar: "know-your-numbers",
      pillarLabel: "Know Your Numbers",
      date: "17 March 2026",
      readTime: "7 min read",
      content: `
        <h2>The Number Banks Use (That Nobody Tells You About)</h2>
        <p>When you walk into a bank and ask for a home loan, there's a number they're quietly building in their head before you've finished your sentence. It's not your credit score. It's not your deposit. It's a composite picture — call it your Bank-Ready Score — that tells them, in about 90 seconds, how likely they are to say yes.</p>
        <p>The problem? Nobody teaches you what goes into it. Most people find out the hard way, when they get a decline letter and don't know why.</p>
        <p>That's what this article is about. Here's how banks actually think about your readiness — and how to know where you stand before you apply.</p>

        <h2>What "Bank-Ready" Actually Means</h2>
        <p>Being bank-ready doesn't mean being perfect. It means your financial profile — income, debts, savings, spending, employment — tells a consistent, low-risk story to a lender.</p>
        <p>Banks are risk managers first. Before they'll lend you $600,000, they need to believe three things:</p>
        <ol style="color:var(--text-muted);font-size:16px;line-height:1.7;margin:0 0 16px 20px;">
          <li style="margin-bottom:8px;"><strong style="color:var(--text);">You can afford the repayments</strong> — now, and if rates rise another 3%</li>
          <li style="margin-bottom:8px;"><strong style="color:var(--text);">You're reliable</strong> — you pay your bills, you manage your money, you don't disappear</li>
          <li style="margin-bottom:8px;"><strong style="color:var(--text);">If something goes wrong, they're protected</strong> — the property is worth what they're lending, and there's equity as a buffer</li>
        </ol>
        <p>Your Bank-Ready Score is how confidently they can say yes to all three.</p>

        <h2>The 5 Signals Banks Are Reading</h2>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">1. Serviceability — Can You Actually Afford It?</h3>
        <p>This is the big one. Banks take your gross income, apply their own "net" formula, then stress-test your repayments at a rate about 3% higher than what you're actually applying for. This is the APRA buffer — it's been sitting at 3% since late 2021, and it catches a lot of people out.</p>
        <p>If you earn $120,000 a year and have a $25,000 car loan and two credit cards, your effective borrowing capacity might be $80,000 lower than a colleague who earns the same with zero debt. Banks don't just look at what you earn — they look at what's left after everything else is accounted for.</p>
        <p><strong>What to do:</strong> Before you apply, close credit cards you don't use (even if the balance is zero, the limit counts against you), pay down high-interest debts, and get a realistic serviceability estimate from a broker — not a generic online calculator.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">2. Credit Health — Your Financial Track Record</h3>
        <p>Your credit file is a history of every credit application, missed payment, and default going back five years. It's more detailed than most people realise — and it's the first thing a lender pulls.</p>
        <p>A score above 700 (Equifax scale) puts you in solid territory. Below 500, most mainstream lenders will hesitate or decline. What many people don't know: a single missed payment, even a $23 utility bill that slipped through, can sit on your file as a default for five years.</p>
        <p><strong>What to do:</strong> Check your credit score now through Equifax, Experian, or illion — all offer free reports. Look for errors. If you find defaults that shouldn't be there, dispute them. It takes time, but it can make a material difference.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">3. Savings Behaviour — The Story Behind the Deposit</h3>
        <p>The deposit is what most people focus on. Banks focus on how you got there. A $100,000 deposit that accumulated over three years of consistent saving tells a completely different story to $100,000 that appeared in your account last Tuesday.</p>
        <p>Lenders call this "genuine savings" — and most require at least 5% of the purchase price to have been held for three months or more. If your deposit includes a gift from family, inheritance, or a sudden windfall, expect extra scrutiny.</p>
        <p><strong>What to do:</strong> Start your savings trail early. Even if you don't need the money yet, consistently saving $500–$1,000/month into a dedicated account builds the narrative banks want to see.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">4. Spending Patterns — Three Months Under a Microscope</h3>
        <p>When you apply for a mortgage, you'll hand over three to six months of bank statements. Banks will read through every line. They're not looking for perfection — they're looking for red flags: gambling transactions, unexplained large transfers, overdraft patterns, or a lifestyle that doesn't match your stated income.</p>
        <p>Buy Now Pay Later services (Afterpay, Zip, Klarna) are increasingly scrutinised too. Every BNPL plan you're running shows up as a liability, even if you always pay on time.</p>
        <p><strong>What to do:</strong> Three months before you apply, tighten up. Not forever — just long enough for the statements to tell a clean story. Clear your BNPL balances, avoid overdrafts, and be ready to explain any unusual transactions.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">5. Employment Stability — Consistency Wins</h3>
        <p>A high income in a brand-new job is less valuable to a lender than a moderate income in a stable long-term role. Banks want to see that your income is predictable and will continue. Ideally: six months or more in your current role, two or more years in the same industry.</p>
        <p>Self-employed borrowers face a different challenge. Most lenders want two years of tax returns, and every dollar your accountant writes off in deductions reduces your stated income — and therefore your borrowing power. If you're planning to buy property, talk to your accountant about this trade-off before lodging your next return.</p>
        <p><strong>What to do:</strong> If you're planning to change jobs, timing matters. Settling your mortgage first, then moving, is almost always the smarter sequence. If you're self-employed, consider whether your last two years of returns tell the income story you need them to tell.</p>

        <h2>How to Know Your Score Before the Bank Does</h2>
        <p>Here's what most people get wrong: they wait until they're ready to buy, then find out their Bank-Ready Score is lower than expected. That's the worst possible time to discover a problem — when you're emotionally invested, your purchase contract has a 21-day finance clause, and you need an unconditional approval by next Friday.</p>
        <p>The smarter move is to check your position 6–12 months before you need to. Not to apply — just to understand the gap between where you are and where you need to be. That gives you time to fix what's fixable: clear debts, build savings, clean up your credit file, and choose the right moment to apply.</p>
        <p>At Oney & Co, we've spent 8 years inside the banking system. We've seen what gets approved and what gets declined — and more importantly, why. A Bank-Ready assessment with us isn't a sales pitch. It's an honest read of your position, so you know exactly what to do next.</p>

          <p>Five minutes. No obligation. Get an honest picture of where you stand — and what it would take to get a yes from a lender.</p>
          <a href="https://fhc.oneyco.com.au" class="btn btn-primary">Start Your Free Health Check →</a>

        <p>The Reserve Bank raised the cash rate by 25 basis points today — from 3.85% to 4.10%. That's the second hike in two months, and exactly what the market had priced in.</p>
        <p>What the market <em>hadn't</em> fully priced in was the tone. Governor Bullock didn't flinch. No hint of a pause. No softening language. The message was clear: inflation is still the enemy, and the RBA is willing to keep going.</p>
        <p>I've been watching rate cycles for eight years from inside the banking system. This one feels different — and I think most borrowers are underestimating where this ends.</p>

        <h2>Why I Think We're Heading Higher</h2>
        <p>The official forecasts from the Big Four banks now cluster around 4.35% as the peak — one more hike in May, then a hold. That's the consensus. And consensus is usually where the surprises live.</p>
        <p>Here's what I'm watching:</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">1. Oil prices aren't cooperating</h3>
        <p>Middle East tensions have pushed oil prices sharply higher. Petrol averaged around 198 cents per litre last week — up 17 cents in a week. Energy feeds into everything: transport, food, manufacturing. The RBA knows this. It's one of the reasons Bullock's language has stayed hawkish even as household budgets tighten.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">2. Services inflation hasn't broken</h3>
        <p>Goods inflation has largely rolled over. But services inflation — rent, insurance, childcare, eating out — is sticky. It's driven by wages and domestic demand, and it doesn't respond quickly to rate hikes. The RBA needs to see this come down before it stops. We're not there yet.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">3. The labour market is too strong</h3>
        <p>Unemployment remains near historic lows. As long as people have jobs and wage growth is running above 3.5%, household spending doesn't collapse. That's good news for the economy — but it keeps the RBA's foot on the brake. A weaker labour market would give them cover to stop. We don't have that yet.</p>

        <h3 style="font-size:18px;font-weight:700;color:var(--text);margin:28px 0 12px;">4. The historical precedent is uncomfortable</h3>
        <p>Australia's cash rate peaked at 4.75% in 2010–2011, the last time the RBA ran a sustained tightening cycle. Before the GFC, it hit 7.25%. The current cycle started from emergency lows (0.10%) and has moved fast — but we're not in unprecedented territory. If this inflation proves stickier than expected, 4.35% won't be the ceiling. 4.60% or even 4.85% isn't off the table.</p>
