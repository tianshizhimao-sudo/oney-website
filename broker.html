<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Page retired — Oney &amp; Co</title>
  <meta name="description" content="This legacy Oney brokerage page has been retired. Oney & Co now focuses on lending education, tools and decision support.">
  <link rel="canonical" href="https://oneyco.com.au/">
  <link rel="icon" type="image/svg+xml" href="/assets/svg/oney-icon.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--oney-bg-dark);color:var(--oney-text-on-dark);font-family:var(--oney-font-sans);padding:24px}
    main{width:min(620px,100%);padding:36px;border:1px solid rgba(255,255,255,.10);border-radius:var(--oney-radius-card-lg);background:rgba(37,37,64,.48);box-shadow:var(--oney-shadow-lift)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.brand img{width:34px;height:34px}.brand strong{font-size:20px;font-weight:600}.dot{color:var(--oney-wordmark-dot)}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oney-purple-soft);margin-bottom:14px} h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0 0 18px} p{color:var(--oney-text-on-dark-strong);line-height:1.7;margin:0 0 24px}
    a{display:inline-flex;padding:12px 18px;border-radius:var(--oney-radius-button);background:linear-gradient(135deg,var(--oney-purple-light),var(--oney-purple));color:white;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/svg/oney-icon.svg" alt=""><strong>Oney &amp; Co<span class="dot">.</span></strong></div>
    <div class="eyebrow">Legacy page retired</div>
    <h1>Oney is focused on lending clarity.</h1>
    <p>This legacy brokerage page is no longer part of the Oney product offering. Oney &amp; Co now focuses on lending education, assessments, calculators and decision-support tools.</p>
    <a href="/">Explore Oney &amp; Co</a>
  </main>
</body>
</html>
